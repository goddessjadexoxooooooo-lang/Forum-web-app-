<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6d4a2d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Forum Web App</title>
    <link rel="manifest" href="/manifest.json" />
    <style>
      :root {
        --bg: #7a4e2e;
        --bg-deep: #5d3b21;
        --panel: #f3eadb;
        --panel-strong: #f7f0e6;
        --surface: rgba(255, 255, 255, 0.09);
        --primary: #c8995f;
        --primary-soft: #dbc29d;
        --text: #2f1f14;
        --muted: #6e5547;
        --dark: #2b1b13;
        --line: rgba(76, 48, 29, 0.32);
        --shadow: rgba(39, 23, 10, 0.22);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        padding: 18px 14px 30px;
      }

      .app-shell {
        width: min(100%, 620px);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .browser-bar {
        background: linear-gradient(180deg, #b58a61, #93714b);
        border: 1px solid rgba(55, 35, 18, 0.55);
        border-radius: 16px 16px 0 0;
        box-shadow: 0 14px 24px rgba(28, 19, 11, 0.2);
        padding: 10px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .browser-icons,
      .browser-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .nav-button,
      .action-button {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255,255,255,0.18);
        border: 1px solid rgba(64,40,22,0.28);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: rgba(255,255,255,0.9);
        font-size: 0.7rem;
      }

      .browser-address {
        flex: 1;
        background: rgba(255,255,255,0.18);
        border: 1px solid rgba(75, 47, 26, 0.35);
        border-radius: 999px;
        min-height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255,255,255,0.9);
        font-size: 0.8rem;
        letter-spacing: 0.02em;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 6px 0;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: rgba(255,255,255,0.96);
      }

      .brand-mark {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #d9b98d, #a87440);
        color: #fff;
        box-shadow: 0 8px 18px rgba(40, 22, 10, 0.25);
      }

      .install-btn {
        border: 1px solid rgba(255,255,255,0.38);
        background: rgba(255,255,255,0.09);
        color: white;
        border-radius: 999px;
        padding: 9px 14px;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
      }

      .hero {
        border: 1px solid rgba(91, 62, 38, 0.12);
        background: rgba(255,255,255,0.06);
        border-radius: 18px;
        padding: 16px 18px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      }

      .eyebrow {
        display: inline-block;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: rgba(255,255,255,0.8);
        font-weight: 700;
        margin-bottom: 8px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        line-height: 1.05;
        letter-spacing: -0.06em;
        color: #fff0dc;
      }

      .subtitle {
        margin: 10px 0 0;
        color: rgba(255,255,255,0.86);
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .form-shell {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 16px 30px rgba(31, 18, 9, 0.18);
      }

      .form-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid rgba(86, 53, 30, 0.22);
        background: rgba(255,255,255,0.08);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255,255,255,0.12);
        color: #fff3dd;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7fe3a8;
        display: inline-block;
      }

      iframe {
        display: block;
        width: 100%;
        height: calc(100vh - 330px);
        min-height: 520px;
        border: none;
        background: #f3eadb;
      }

      @media (min-width: 700px) {
        .app-shell { width: min(100%, 760px); }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="browser-bar" aria-label="Browser bar">
        <div class="browser-icons">
          <span class="nav-button">◁</span>
          <span class="nav-button">▷</span>
          <span class="nav-button">⟳</span>
        </div>

        <div class="browser-address">app.zite.com</div>

        <div class="browser-actions">
          <span class="action-button">⟳</span>
          <span class="action-button">＋</span>
        </div>
      </div>

      <div class="topbar">
        <div class="brand">
          <span class="brand-mark">F</span>
          <span>Forum</span>
        </div>
        <button id="installBtn" class="install-btn" hidden>Install app</button>
      </div>

      <section class="hero">
        <span class="eyebrow">Member access</span>
        <h1>Join the conversation.</h1>
        <p class="subtitle">
          This version matches the warm brown, tan, and cream tone of the form experience shown in the reference.
        </p>
      </section>

      <main class="form-shell" aria-label="Forum form app">
        <div class="form-header">
          <span class="chip"><span class="dot"></span> Live form</span>
        </div>

        <iframe src="https://form.fillout.com/t/vQYGmm4XNrus" title="Forum form"></iframe>
      </main>
    </div>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }

      let deferredPrompt;
      const installBtn = document.getElementById('installBtn');

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredPrompt = event;
        installBtn.hidden = false;
      });

      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.hidden = true;
      });
    </script>
  </body>
</html>
